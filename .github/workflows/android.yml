name: Build FigCraft APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # Otomatis mengirim input "y" (yes) pada prompt instalasi Flutter SDK Flet
      - name: Build FigCraft Android
        working-directory: ${{ github.workspace }}
        run: yes | flet build apk -v

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: figcraft-android-apk
          path: build/apk/**/*.apk
