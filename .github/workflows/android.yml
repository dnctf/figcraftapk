name: Build FigCraft Android APK

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "FigCraft branch/tag"
        required: true
        default: "main"
        type: string

      build_mode:
        description: "Build mode"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - debug

      package_name:
        description: "Android package name"
        required: true
        default: "com.artcraft.figcraft"
        type: string

      app_name:
        description: "Application name"
        required: true
        default: "FigCraft"
        type: string

permissions:
  contents: read

concurrency:
  group: figcraft-android-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_API: "35"
  ANDROID_BUILD_TOOLS: "35.0.0"
  ANDROID_NDK: "27.2.12479018"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:

  build:

    name: Build FigCraft Android ARM64

    runs-on: ubuntu-24.04

    timeout-minutes: 90

    steps:

      # =========================================================
      # SOURCE
      # =========================================================

      - name: Checkout FigCraft fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show repository
        run: |
          echo "Repository:"
          echo "${{ github.repository }}"

          echo "Commit:"
          git rev-parse HEAD

          echo "Branch:"
          git branch --show-current

      # =========================================================
      # LINUX DEPENDENCIES
      # =========================================================

      - name: Install dependencies
        run: |

          sudo apt-get update

          sudo apt-get install -y \
            git \
            curl \
            wget \
            unzip \
            zip \
            build-essential \
            pkg-config \
            libssl-dev \
            python3 \
            python3-pip \
            clang \
            cmake \
            ninja-build \
            file \
            jq

      # =========================================================
      # JAVA
      # =========================================================

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Check Java
        run: |
          java -version

      # =========================================================
      # RUST
      # =========================================================

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          components: rustfmt, clippy

      - name: Check Rust
        run: |
          rustc --version
          cargo --version

          rustup target list --installed

      # =========================================================
      # CARGO CACHE
      # =========================================================

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
          key: cargo-android-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-android-${{ runner.os }}-

      # =========================================================
      # ANDROID SDK
      # =========================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK}"

          yes | sdkmanager --licenses || true

      - name: Check Android
        run: |

          adb version || true

          echo "ANDROID_HOME=$ANDROID_HOME"

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

      # =========================================================
      # CARGO NDK
      # =========================================================

      - name: Install cargo-ndk
        run: |

          cargo install cargo-ndk \
            --version 4.1.2 \
            --locked

          cargo ndk --version

      # =========================================================
      # ANDROID BUILDER
      # =========================================================

      - name: Checkout ArtCraft Android Builder
        uses: actions/checkout@v4
        with:
          repository: MostafaXS1/artcraft-android
          ref: main
          path: android-builder
          fetch-depth: 1

      # =========================================================
      # CONFIGURE BUILDER
      # =========================================================

      - name: Configure FigCraft fork
        working-directory: android-builder
        env:
          FIGCRAFT_REPO: https://github.com/${{ github.repository }}.git
          FIGCRAFT_ORIGIN: https://github.com/${{ github.repository }}
        run: |

          python3 <<'PY'

          from pathlib import Path
          import os

          path = Path("lib/build-common.sh")

          if not path.exists():
              raise SystemExit(
                  "Android builder structure changed: "
                  "lib/build-common.sh not found."
              )

          text = path.read_text()

          old_repo = \
              'REPO="https://github.com/storytold/$APP.git"'

          new_repo = \
              'REPO="${FIGCRAFT_REPO_URL:-https://github.com/storytold/$APP.git}"'

          old_origin = \
              'APP_ORIGIN="https://github.com/storytold/$APP"'

          new_origin = \
              'APP_ORIGIN="${FIGCRAFT_APP_ORIGIN:-https://github.com/storytold/$APP}"'

          if old_repo not in text:
              raise SystemExit(
                  "REPO definition was not found."
              )

          if old_origin not in text:
              raise SystemExit(
                  "APP_ORIGIN definition was not found."
              )

          text = text.replace(
              old_repo,
              new_repo,
              1
          )

          text = text.replace(
              old_origin,
              new_origin,
              1
          )

          path.write_text(text)

          print(
              "Configured repository:",
              os.environ["FIGCRAFT_REPO"]
          )

          PY

      # =========================================================
      # BUILD
      # =========================================================

      - name: Build FigCraft Android
        working-directory: android-builder
        env:
          FIGCRAFT_REPO_URL: https://github.com/${{ github.repository }}.git
          FIGCRAFT_APP_ORIGIN: https://github.com/${{ github.repository }}
        run: |

          chmod +x build.sh

          REF="${{ inputs.source_ref }}"

          if [ -z "$REF" ]; then
            REF="main"
          fi

          echo "======================================"
          echo "FigCraft Android"
          echo "======================================"

          echo "Repository:"
          echo "$FIGCRAFT_REPO_URL"

          echo "Ref:"
          echo "$REF"

          echo "======================================"

          if [ "$REF" = "main" ]; then

            REF_OPTION="-main"

          elif [ "$REF" = "stable" ]; then

            REF_OPTION="-stable"

          else

            REF_OPTION="-branch=$REF"

          fi

          if [ "${{ inputs.build_mode }}" = "debug" ]; then

            chmod +x build-debug.sh

            ./build-debug.sh \
              -figcraft \
              "$REF_OPTION" \
              "-appname=${{ inputs.app_name }}" \
              "-packagename=${{ inputs.package_name }}"

          else

            ./build.sh \
              -figcraft \
              "$REF_OPTION" \
              "-appname=${{ inputs.app_name }}" \
              "-packagename=${{ inputs.package_name }}"

          fi

      # =========================================================
      # APK
      # =========================================================

      - name: Find APK
        id: apk
        working-directory: android-builder
        run: |

          set -e

          mkdir -p verified

          APK=$(find output \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then

            echo "APK was not generated."

            find . \
              -maxdepth 5 \
              -type f \
              \( \
                -name "*.apk" \
                -o \
                -name "*.log" \
              \) \
              -print

            exit 1

          fi

          echo "APK:"
          echo "$APK"

          cp "$APK" verified/

      # =========================================================
      # VALIDATE
      # =========================================================

      - name: Validate APK
        working-directory: android-builder
        run: |

          APK=$(find verified \
            -type f \
            -name "*.apk" \
            | head -n 1)

          test -n "$APK"

          SIZE=$(stat -c%s "$APK")

          echo "APK size: $SIZE bytes"

          if [ "$SIZE" -lt 1000000 ]; then
            echo "APK is suspiciously small."
            exit 1
          fi

          unzip -tq "$APK"

          sha256sum "$APK" \
            > verified/SHA256SUMS.txt

      # =========================================================
      # ARTIFACT
      # =========================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: figcraft-android-${{ inputs.build_mode }}
          path: |
            android-builder/verified/*.apk
            android-builder/verified/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      # =========================================================
      # DEBUG LOG
      # =========================================================

      - name: Upload builder logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: figcraft-android-debug
          path: |
            android-builder/logs/
            android-builder/output/
          if-no-files-found: warn
          retention-days: 14
