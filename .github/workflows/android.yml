name: Build Android

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Mengizinkan eksekusi manual

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      # 1. Menarik source code FigCraft ke dalam runner (Solusi utama untuk error exit 1)
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive # Penting jika repositori menggunakan submodule

      # 2. Menyiapkan Java (Syarat wajib untuk environment Android SDK/NDK)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Menyiapkan Python (Untuk menjalankan skrip builder eksternal)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Sesuaikan dengan versi yang didukung skrip Anda

      # 4. Menyiapkan Rust & Target Android (Karena FigCraft berbasis Rust)
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android

      # 5. Instalasi dependensi Python jika diperlukan skrip builder
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # pip install -r requirements.txt (Hapus tanda # jika ada file requirements)

      # 6. Eksekusi skrip builder
      - name: Build FigCraft Android
        working-directory: ${{ github.workspace }}
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk-bundle
        run: |
          # Ganti 'build_script.py' dengan nama dan path file asli milik FigCraft
          python build_script.py
          
      # 7. Upload hasil APK sebagai artifact agar bisa diunduh
      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: figcraft-android-apk
          path: '**/*.apk' # Secara otomatis mencari file APK yang dihasilkan
