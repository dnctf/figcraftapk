name: Build FigCraft Android APK

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Branch/tag FigCraft yang akan dibuild"
        required: true
        default: "main"
        type: string

      build_mode:
        description: "APK build mode"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - debug

      package_name:
        description: "Android package name"
        required: true
        default: "com.artcraft.figcraft"
        type: string

      app_name:
        description: "Nama aplikasi Android"
        required: true
        default: "FigCraft"
        type: string

permissions:
  contents: read

concurrency:
  group: figcraft-android-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_API: "35"
  ANDROID_BUILD_TOOLS: "35.0.0"
  ANDROID_NDK: "27.2.12479018"

jobs:

  build:

    name: Build FigCraft Android ARM64

    runs-on: ubuntu-24.04

    timeout-minutes: 90

    steps:

      # ---------------------------------------------------------
      # 1. Checkout fork FigCraft
      # ---------------------------------------------------------

      - name: Checkout FigCraft fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------------------------------------------------------
      # 2. Basic dependencies
      # ---------------------------------------------------------

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            curl \
            wget \
            unzip \
            zip \
            build-essential \
            pkg-config \
            libssl-dev \
            python3 \
            python3-pip \
            clang \
            cmake \
            ninja-build \
            file \
            jq

      # ---------------------------------------------------------
      # 3. Java
      # ---------------------------------------------------------

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # ---------------------------------------------------------
      # 4. Rust
      # ---------------------------------------------------------

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          components: rustfmt, clippy

      - name: Show Rust version
        run: |
          rustc --version
          cargo --version
          rustup show

      # ---------------------------------------------------------
      # 5. Cargo cache
      # ---------------------------------------------------------

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
          key: |
            cargo-android-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-android-${{ runner.os }}-

      # ---------------------------------------------------------
      # 6. Android SDK
      # ---------------------------------------------------------

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK}"

          yes | sdkmanager --licenses || true

      # ---------------------------------------------------------
      # 7. Environment
      # ---------------------------------------------------------

      - name: Configure Android environment
        run: |

          echo "ANDROID_HOME=$ANDROID_HOME"

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          if [ -n "${ANDROID_NDK_HOME:-}" ]; then
            echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          fi

      # ---------------------------------------------------------
      # 8. Install cargo-ndk
      # ---------------------------------------------------------

      - name: Install cargo-ndk
        run: |

          cargo install cargo-ndk \
            --version 4.1.2 \
            --locked

          cargo ndk --version

      # ---------------------------------------------------------
      # 9. Checkout Android builder
      # ---------------------------------------------------------

      - name: Checkout ArtCraft Android builder
        uses: actions/checkout@v4
        with:
          repository: MostafaXS1/artcraft-android
          ref: main
          path: android-builder
          fetch-depth: 1

      # ---------------------------------------------------------
      # 10. Point builder to THIS fork
      # ---------------------------------------------------------

      - name: Configure builder for this FigCraft fork
        env:
          FORK_REPOSITORY: ${{ github.server_url }}/${{ github.repository }}.git
          FORK_ORIGIN: ${{ github.server_url }}/${{ github.repository }}
        working-directory: android-builder
        run: |

          python3 <<'PY'

          from pathlib import Path
          import os

          path = Path("lib/build-common.sh")

          text = path.read_text()

          old_repo = 'REPO="https://github.com/storytold/$APP.git"'

          new_repo = (
              'REPO="${FIGCRAFT_REPO_URL:-'
              'https://github.com/storytold/$APP.git}"'
          )

          old_origin = 'APP_ORIGIN="https://github.com/storytold/$APP"'

          new_origin = (
              'APP_ORIGIN="${FIGCRAFT_APP_ORIGIN:-'
              'https://github.com/storytold/$APP}"'
          )

          if old_repo not in text:
              raise SystemExit(
                  "Could not locate REPO definition in Android builder."
              )

          if old_origin not in text:
              raise SystemExit(
                  "Could not locate APP_ORIGIN definition in Android builder."
              )

          text = text.replace(
              old_repo,
              new_repo,
              1
          )

          text = text.replace(
              old_origin,
              new_origin,
              1
          )

          path.write_text(text)

          print(
              "FigCraft repository:",
              os.environ["FORK_REPOSITORY"]
          )

          print(
              "FigCraft origin:",
              os.environ["FORK_ORIGIN"]
          )

          PY

      # ---------------------------------------------------------
      # 11. Build FigCraft
      # ---------------------------------------------------------

      - name: Build FigCraft Android
        working-directory: android-builder
        env:
          FIGCRAFT_REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
          FIGCRAFT_APP_ORIGIN: ${{ github.server_url }}/${{ github.repository }}
        run: |

          chmod +x build.sh
          chmod +x build-debug.sh

          SOURCE_REF="${{ inputs.source_ref }}"

          if [ -z "$SOURCE_REF" ]; then
            SOURCE_REF="main"
          fi

          BUILD_MODE="${{ inputs.build_mode }}"

          if [ -z "$BUILD_MODE" ]; then
            BUILD_MODE="release"
          fi

          echo "======================================"
          echo "FigCraft Android Build"
          echo "======================================"

          echo "Repository:"
          echo "$FIGCRAFT_REPO_URL"

          echo "Source:"
          echo "$SOURCE_REF"

          echo "Mode:"
          echo "$BUILD_MODE"

          echo "Package:"
          echo "${{ inputs.package_name }}"

          echo "======================================"

          if [ "$SOURCE_REF" = "main" ]; then

            SOURCE_OPTION="-main"

          elif [ "$SOURCE_REF" = "stable" ]; then

            SOURCE_OPTION="-stable"

          else

            SOURCE_OPTION="-branch=$SOURCE_REF"

          fi

          if [ "$BUILD_MODE" = "debug" ]; then

            bash build-debug.sh \
              -figcraft \
              "$SOURCE_OPTION" \
              "-appname=${{ inputs.app_name }}" \
              "-packagename=${{ inputs.package_name }}"

          else

            bash build.sh \
              -figcraft \
              "$SOURCE_OPTION" \
              "-appname=${{ inputs.app_name }}" \
              "-packagename=${{ inputs.package_name }}"

          fi

      # ---------------------------------------------------------
      # 12. Locate APK
      # ---------------------------------------------------------

      - name: Find generated APK
        id: apk
        working-directory: android-builder
        run: |

          set -e

          mkdir -p verified

          APK="$(find output -type f -name '*.apk' | head -n 1)"

          if [ -z "$APK" ]; then

            echo "ERROR: APK was not generated."

            echo ""
            echo "Output directory:"
            find output -maxdepth 3 -type f -print || true

            echo ""
            echo "Build logs:"
            find logs -maxdepth 2 -type f -print || true

            exit 1

          fi

          echo "APK found:"
          echo "$APK"

          cp "$APK" verified/

          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------
      # 13. Validate APK
      # ---------------------------------------------------------

      - name: Validate APK
        working-directory: android-builder
        run: |

          set -e

          APK="$(find verified -type f -name '*.apk' | head -n 1)"

          echo "Validating:"
          echo "$APK"

          FILE_SIZE=$(stat -c%s "$APK")

          echo "APK size:"
          echo "$FILE_SIZE bytes"

          if [ "$FILE_SIZE" -lt 1000000 ]; then

            echo "ERROR: APK is suspiciously small."

            exit 1

          fi

          unzip -tq "$APK"

          echo "APK ZIP integrity: OK"

          sha256sum "$APK" \
            > verified/SHA256SUMS.txt

      # ---------------------------------------------------------
      # 14. Upload APK
      # ---------------------------------------------------------

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: figcraft-android-${{ inputs.build_mode }}
          path: |
            android-builder/verified/*.apk
            android-builder/verified/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      # ---------------------------------------------------------
      # 15. Upload logs if build failed
      # ---------------------------------------------------------

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: figcraft-android-build-logs
          path: |
            android-builder/logs/**
          if-no-files-found: warn
          retention-days: 14
