name: Build FigCraft Android APK

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "FigCraft branch/tag/commit yang akan dibuild"
        required: true
        default: "main"
        type: string

      build_mode:
        description: "Build mode"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - debug

      package_name:
        description: "Android package name"
        required: true
        default: "com.artcraft.figcraft"
        type: string

      app_name:
        description: "Application name"
        required: true
        default: "FigCraft"
        type: string

permissions:
  contents: read

concurrency:
  group: figcraft-android-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_API: "35"
  ANDROID_BUILD_TOOLS: "35.0.0"
  ANDROID_NDK: "27.2.12479018"

  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

  # Repository sumber aplikasi.
  FIGCRAFT_REPO_URL: https://github.com/${{ github.repository }}.git
  FIGCRAFT_APP_ORIGIN: https://github.com/${{ github.repository }}

jobs:

  # ============================================================
  # BUILD
  # ============================================================

  build:

    name: Build FigCraft Android ARM64

    runs-on: ubuntu-24.04

    timeout-minutes: 120

    steps:

      # ========================================================
      # CHECKOUT CURRENT FORK
      # ========================================================

      - name: Checkout FigCraft fork
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Show repository information
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "FIGCRAFT SOURCE"
          echo "=============================================="

          echo "Repository:"
          echo "${{ github.repository }}"

          echo "GitHub ref:"
          echo "${{ github.ref }}"

          echo "Commit:"
          git rev-parse HEAD

          echo "Commit short:"
          git rev-parse --short HEAD

          echo "Git status:"
          git status --short

          echo
          echo "Branches:"
          git branch -a || true

          echo
          echo "Tags:"
          git tag --points-at HEAD || true

      # ========================================================
      # SYSTEM DEPENDENCIES
      # ========================================================

      - name: Install Linux dependencies
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            curl \
            wget \
            unzip \
            zip \
            tar \
            gzip \
            xz-utils \
            build-essential \
            pkg-config \
            libssl-dev \
            python3 \
            python3-pip \
            python3-venv \
            clang \
            cmake \
            ninja-build \
            file \
            jq \
            patchelf \
            lld

      # ========================================================
      # JAVA
      # ========================================================

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify Java
        shell: bash
        run: |
          set -e

          echo "Java:"
          java -version

          echo
          echo "JAVA_HOME:"
          echo "$JAVA_HOME"

      # ========================================================
      # RUST
      # ========================================================

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          components: rustfmt, clippy

      - name: Verify Rust
        shell: bash
        run: |
          set -e

          echo "Rust:"
          rustc --version

          echo
          echo "Cargo:"
          cargo --version

          echo
          echo "Rustup:"
          rustup --version

          echo
          echo "Installed targets:"
          rustup target list --installed

          echo
          echo "Checking ARM64 Android target..."

          rustup target list --installed \
            | grep -qx "aarch64-linux-android"

          echo "ARM64 Android target: OK"

      # ========================================================
      # CARGO CACHE
      # ========================================================

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: >
            cargo-android-
            ${{ runner.os }}-
            ${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-android-${{ runner.os }}-

      # ========================================================
      # ANDROID SDK
      # ========================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      # ========================================================
      # ANDROID SDK PACKAGES
      #
      # IMPORTANT:
      # Jangan install package bernama "tools".
      # Package tersebut sudah deprecated / tidak tersedia.
      # ========================================================

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses > /tmp/android-licenses.log 2>&1 || true

          echo "Android license processing completed."

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "ANDROID SDK INSTALLATION"
          echo "=============================================="

          echo "API:"
          echo "$ANDROID_API"

          echo "Build Tools:"
          echo "$ANDROID_BUILD_TOOLS"

          echo "NDK:"
          echo "$ANDROID_NDK"

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK}"

      # ========================================================
      # VERIFY ANDROID
      # ========================================================

      - name: Verify Android environment
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "ANDROID ENVIRONMENT"
          echo "=============================================="

          echo "ANDROID_HOME:"
          echo "${ANDROID_HOME:-<not set>}"

          echo
          echo "ANDROID_SDK_ROOT:"
          echo "${ANDROID_SDK_ROOT:-<not set>}"

          echo
          echo "Java:"
          java -version

          echo
          echo "SDK Manager:"
          sdkmanager --version

          echo
          echo "ADB:"
          adb version

          echo
          echo "Installed Android platforms:"
          sdkmanager --list_installed \
            | grep -E "platforms;android-|build-tools;|ndk;" \
            || true

          echo
          echo "Checking required directories..."

          test -d "$ANDROID_SDK_ROOT/platforms/android-${ANDROID_API}"

          test -d "$ANDROID_SDK_ROOT/build-tools/${ANDROID_BUILD_TOOLS}"

          test -d "$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK}"

          echo
          echo "Android SDK:"
          echo "OK"

          echo "Android Build Tools:"
          echo "OK"

          echo "Android NDK:"
          echo "OK"

      # ========================================================
      # CARGO NDK
      # ========================================================

      - name: Install cargo-ndk
        shell: bash
        run: |
          set -e

          cargo install cargo-ndk \
            --version 4.1.2 \
            --locked

      - name: Verify cargo-ndk
        shell: bash
        run: |
          set -e

          echo "cargo-ndk:"
          cargo ndk --version

          echo
          echo "Cargo NDK location:"
          which cargo-ndk || true

      # ========================================================
      # CHECK FIGCRAFT SOURCE
      # ========================================================

      - name: Verify FigCraft source
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "FIGCRAFT SOURCE CHECK"
          echo "=============================================="

          test -f Cargo.toml

          echo "Cargo.toml found."

          echo
          echo "Workspace/package information:"
          cargo metadata \
            --no-deps \
            --format-version 1 \
            > /tmp/figcraft-metadata.json

          jq -r '
            .packages[]
            | "package=\(.name) version=\(.version)"
          ' /tmp/figcraft-metadata.json \
            || true

      # ========================================================
      # CHECKOUT ANDROID BUILDER
      # ========================================================

      - name: Checkout ArtCraft Android Builder
        uses: actions/checkout@v6
        with:
          repository: MostafaXS1/artcraft-android
          ref: main
          path: android-builder
          fetch-depth: 1

      # ========================================================
      # VERIFY BUILDER
      # ========================================================

      - name: Verify Android builder
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "ANDROID BUILDER"
          echo "=============================================="

          test -d android-builder

          test -f android-builder/build.sh

          test -f android-builder/build-debug.sh

          test -f android-builder/lib/build-common.sh

          echo "build.sh:"
          ls -lh android-builder/build.sh

          echo
          echo "build-debug.sh:"
          ls -lh android-builder/build-debug.sh

          echo
          echo "build-common.sh:"
          ls -lh android-builder/lib/build-common.sh

          echo
          echo "Builder commit:"
          git -C android-builder rev-parse HEAD

      # ========================================================
      # CONFIGURE BUILDER
      # ========================================================

      - name: Configure builder for current fork
        working-directory: android-builder
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 <<'PY'
          from pathlib import Path

          path = Path("lib/build-common.sh")

          if not path.exists():
              raise SystemExit(
                  "ERROR: lib/build-common.sh was not found."
              )

          text = path.read_text()

          old_repo = 'REPO="https://github.com/storytold/$APP.git"'
          old_origin = 'APP_ORIGIN="https://github.com/storytold/$APP"'

          new_repo = (
              'REPO="${FIGCRAFT_REPO_URL:-'
              'https://github.com/storytold/$APP.git}"'
          )

          new_origin = (
              'APP_ORIGIN="${FIGCRAFT_APP_ORIGIN:-'
              'https://github.com/storytold/$APP}"'
          )

          changed = False

          if old_repo in text:
              text = text.replace(
                  old_repo,
                  new_repo,
                  1
              )
              changed = True

          if old_origin in text:
              text = text.replace(
                  old_origin,
                  new_origin,
                  1
              )
              changed = True

          if not changed:
              print(
                  "Builder repository/origin definitions were "
                  "already configured or builder structure changed."
              )

          path.write_text(text)

          print()
          print("Builder configured for:")
          print("  ", __import__("os").environ["FIGCRAFT_REPO_URL"])
          print()
          PY

      # ========================================================
      # SHOW BUILDER CONFIG
      # ========================================================

      - name: Inspect builder configuration
        working-directory: android-builder
        shell: bash
        run: |
          set -e

          echo "Repository configuration:"
          grep -n \
            -E "REPO=|APP_ORIGIN=" \
            lib/build-common.sh \
            || true

          echo
          echo "Available builder scripts:"
          find . \
            -maxdepth 2 \
            -type f \
            \( \
              -name "*.sh" \
              -o \
              -name "*.py" \
            \) \
            -print \
            | sort

      # ========================================================
      # BUILD
      # ========================================================

     - name: Build FigCraft Android
  id: build
  working-directory: android-builder
  env:
    FIGCRAFT_REPO_URL: https://github.com/${{ github.repository }}.git
    FIGCRAFT_APP_ORIGIN: https://github.com/${{ github.repository }}
    ARTCRAFT_TARGET_SDK: ${{ env.ANDROID_API }}
    ARTCRAFT_NDK_VERSION: ${{ env.ANDROID_NDK }}
    ARTCRAFT_BUILD_TOOLS_VERSION: ${{ env.ANDROID_BUILD_TOOLS }}
  shell: bash
  run: |
    set -Eeuo pipefail

    mkdir -p logs
    mkdir -p output

    LOG_FILE="$PWD/logs/figcraft-build.log"

    REF="${{ inputs.source_ref }}"

    if [ -z "$REF" ]; then
      REF="main"
    fi

    echo "=============================================="
    echo "FIGCRAFT ANDROID BUILD"
    echo "=============================================="

    echo "Repository:"
    echo "$FIGCRAFT_REPO_URL"

    echo
    echo "Origin:"
    echo "$FIGCRAFT_APP_ORIGIN"

    echo
    echo "Ref:"
    echo "$REF"

    echo
    echo "Application:"
    echo "${{ inputs.app_name }}"

    echo
    echo "Package:"
    echo "${{ inputs.package_name }}"

    echo
    echo "Mode:"
    echo "${{ inputs.build_mode }}"

    echo
    echo "=============================================="

    # ----------------------------------------------------------
    # Verify the patched builder before starting.
    # ----------------------------------------------------------

    echo
    echo "Builder repository configuration:"

    grep -n \
      -E '^REPO=|^APP_ORIGIN=' \
      lib/build-common.sh

    # ----------------------------------------------------------
    # Clean only builder-generated source/output.
    #
    # This is safe on GitHub Actions because this is a fresh
    # runner. It also prevents a stale checkout from being reused.
    # ----------------------------------------------------------

    rm -rf source/figcraft
    rm -rf source/.clone-figcraft.*
    rm -rf output/*
    rm -rf build/figcraft

    mkdir -p source output logs

    # ----------------------------------------------------------
    # Resolve source ref.
    # ----------------------------------------------------------

    if [ "$REF" = "main" ]; then

      REF_OPTION="-main"

    elif [ "$REF" = "stable" ]; then

      REF_OPTION="-stable"

    else

      REF_OPTION="-branch=$REF"

    fi

    echo
    echo "Builder source option:"
    echo "$REF_OPTION"

    # ----------------------------------------------------------
    # Run builder.
    # ----------------------------------------------------------

    set +e

    if [ "${{ inputs.build_mode }}" = "debug" ]; then

      chmod +x build-debug.sh

      ./build-debug.sh \
        -figcraft \
        "$REF_OPTION" \
        "-appname=${{ inputs.app_name }}" \
        "-packagename=${{ inputs.package_name }}" \
        2>&1 | tee "$LOG_FILE"

    else

      chmod +x build.sh

      ./build.sh \
        -figcraft \
        "$REF_OPTION" \
        "-appname=${{ inputs.app_name }}" \
        "-packagename=${{ inputs.package_name }}" \
        2>&1 | tee "$LOG_FILE"

    fi

    BUILD_EXIT=${PIPESTATUS[0]}

    set -e

    echo
    echo "Builder exit code: $BUILD_EXIT"

    if [ "$BUILD_EXIT" -ne 0 ]; then

      echo
      echo "=============================================="
      echo "BUILD FAILED"
      echo "=============================================="

      echo
      echo "Last 250 lines:"
      tail -n 250 "$LOG_FILE" || true

      exit "$BUILD_EXIT"
    fi

    echo
    echo "=============================================="
    echo "BUILDER COMPLETED"
    echo "=============================================="

    echo
    echo "Generated APK candidates:"

    find . \
      -type f \
      -name "*.apk" \
      -print \
      || true
      # ========================================================
      # INSPECT OUTPUT
      # ========================================================

      - name: Inspect builder output
        if: always()
        working-directory: android-builder
        shell: bash
        run: |
          echo "=============================================="
          echo "BUILDER OUTPUT"
          echo "=============================================="

          echo
          echo "Directory tree:"
          find . \
            -maxdepth 5 \
            -type f \
            | sort \
            | head -500 \
            || true

          echo
          echo "APK files:"
          find . \
            -type f \
            -name "*.apk" \
            -print \
            || true

          echo
          echo "Logs:"
          find logs \
            -type f \
            -print \
            2>/dev/null \
            || true

      # ========================================================
      # FIND APK
      # ========================================================

      - name: Find generated APK
        id: apk
        working-directory: android-builder
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p verified

          APK="$(find output \
            -type f \
            -name "*.apk" \
            -print \
            | head -n 1)"

          if [ -z "$APK" ]; then

            echo "::error::No APK was generated."

            echo
            echo "Searching entire builder directory..."

            find . \
              -type f \
              \( \
                -name "*.apk" \
                -o \
                -name "*.aab" \
                -o \
                -name "*.log" \
              \) \
              -print \
              || true

            exit 1
          fi

          echo "Generated APK:"
          echo "$APK"

          APK_NAME="$(basename "$APK")"

          cp "$APK" "verified/$APK_NAME"

          echo "apk_path=verified/$APK_NAME" >> "$GITHUB_OUTPUT"

      # ========================================================
      # VALIDATE APK
      # ========================================================

      - name: Validate APK
        working-directory: android-builder
        shell: bash
        run: |
          set -Eeuo pipefail

          APK="$(find verified \
            -type f \
            -name "*.apk" \
            -print \
            | head -n 1)"

          if [ -z "$APK" ]; then
            echo "::error::Verified APK not found."
            exit 1
          fi

          echo "APK:"
          echo "$APK"

          echo
          echo "File information:"
          file "$APK"

          echo
          echo "APK size:"
          ls -lh "$APK"

          SIZE="$(stat -c%s "$APK")"

          echo
          echo "APK size in bytes:"
          echo "$SIZE"

          if [ "$SIZE" -lt 1000000 ]; then
            echo "::error::APK is suspiciously small."
            exit 1
          fi

          echo
          echo "Testing APK ZIP integrity..."

          unzip -tq "$APK"

          echo
          echo "APK ZIP integrity: OK"

          echo
          echo "SHA256:"

          sha256sum "$APK" \
            | tee verified/SHA256SUMS.txt

      # ========================================================
      # CHECK APK ARCHITECTURE
      # ========================================================

      - name: Check APK native libraries
        working-directory: android-builder
        shell: bash
        run: |
          set -e

          APK="$(find verified \
            -type f \
            -name "*.apk" \
            -print \
            | head -n 1)"

          echo "Checking APK native libraries..."

          unzip -l "$APK" \
            | grep -E \
              "lib/arm64-v8a/|lib/aarch64/" \
              || true

          echo
          echo "ARM64 check completed."

      # ========================================================
      # UPLOAD APK
      # ========================================================

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: figcraft-android-${{ inputs.build_mode }}-arm64
          path: |
            android-builder/verified/*.apk
            android-builder/verified/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      # ========================================================
      # UPLOAD DIAGNOSTICS
      # ========================================================

      - name: Upload builder diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: figcraft-android-diagnostics
          path: |
            android-builder/logs/**
            android-builder/output/**
          if-no-files-found: warn
          retention-days: 14
