name: Build FigCraft APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Menarik source code dari repositori ke dalam runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Menyiapkan environment Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Menyiapkan Java (Sudah diperbarui ke v5 agar tidak ada warning)
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # 4. Menginstal Flet dan dependensi Python proyek Anda
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet
          # Menginstal dependensi tambahan jika ada file requirements.txt
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 5. Mengeksekusi proses build APK menggunakan Flet (dengan mode verbose)
      - name: Build FigCraft Android
        working-directory: ${{ github.workspace }}
        run: flet build apk -v

      # 6. Mengunggah file APK yang sudah jadi agar bisa Anda unduh
      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: figcraft-android-apk
          path: build/apk/**/*.apk
