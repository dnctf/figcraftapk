name: Build FigCraft Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      source_ref:
        description: "FigCraft branch/tag/commit yang akan dibuild"
        required: true
        default: "main"
        type: string
      build_mode:
        description: "Build mode"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - debug
      package_name:
        description: "Android package name"
        required: true
        default: "com.artcraft.figcraft"
        type: string
      app_name:
        description: "Application name"
        required: true
        default: "FigCraft"
        type: string

permissions:
  contents: read

concurrency:
  group: figcraft-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build FigCraft Android ARM64
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Free disk space
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk \
            /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY/CodeQL" || true

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: cargo-android-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-android-${{ runner.os }}-

      - name: Install cargo-apk
        run: cargo install cargo-apk

      - name: Configure Android Metadata
        shell: bash
        env:
          IN_PKG: ${{ inputs.package_name || 'com.artcraft.figcraft' }}
          IN_APP: ${{ inputs.app_name || 'FigCraft' }}
        run: |
          MANIFEST="apps/figcraft/Cargo.toml"
          if [ ! -f "$MANIFEST" ]; then
            echo "::warning::apps/figcraft/Cargo.toml tidak ditemukan, menggunakan Cargo.toml root"
            MANIFEST="Cargo.toml"
          fi
          
          # Menambahkan konfigurasi dinamis berdasarkan input workflow_dispatch
          cat <<EOF >> "$MANIFEST"

          [package.metadata.android]
          package = "${IN_PKG}"
          apk_name = "${IN_APP}"
          assets = "../../assets"
          icon = "@mipmap/ic_launcher"
          EOF

      - name: Build APK (Release)
        if: ${{ inputs.build_mode == 'release' || github.event_name != 'workflow_dispatch' }}
        run: |
          if [ -f "apps/figcraft/Cargo.toml" ]; then
            cargo apk build --release --manifest-path apps/figcraft/Cargo.toml
          else
            cargo apk build --release
          fi

      - name: Build APK (Debug)
        if: ${{ inputs.build_mode == 'debug' }}
        run: |
          if [ -f "apps/figcraft/Cargo.toml" ]; then
            cargo apk build --manifest-path apps/figcraft/Cargo.toml
          else
            cargo apk build
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app_name || 'FigCraft' }}-Android-${{ inputs.build_mode || 'release' }}-arm64
          path: target/**/apk/*.apk
          if-no-files-found: error
          retention-days: 30
